<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>struber.life</title>

  <style>
    :root {
      --pink: #f5054f;
      --white-soft: rgba(255, 255, 255, 0.78);
      --white-muted: rgba(255, 255, 255, 0.55);
      --border-soft: rgba(255, 255, 255, 0.22);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background: #050505;
    }

    body {
      background-image:
        linear-gradient(rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0.82)),
        url("https://images.pexels.com/photos/417074/pexels-photo-417074.jpeg");
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 8px;
      background: var(--pink);
      z-index: 100;
      box-shadow: 0 0 18px rgba(245, 5, 79, 0.45);
    }

    .slider {
      width: 300vw;
      height: 100vh;
      display: flex;
      transition: transform 0.85s cubic-bezier(0.76, 0, 0.24, 1);
    }

    .slide {
      width: 100vw;
      height: 100vh;
      padding: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      position: relative;
    }

    .content {
      max-width: 720px;
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    .content.is-leaving {
      opacity: 0;
      transform: translateY(16px);
    }

    .content.is-entering {
      opacity: 0;
      transform: translateY(16px);
    }

    .content.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .logo {
      width: 92px;
      margin-bottom: 34px;
      opacity: 0.96;
    }

    h1,
    h2 {
      color: var(--pink);
      font-weight: 600;
      letter-spacing: -0.04em;
      margin: 0 0 22px;
    }

    h1 {
      font-size: clamp(2.7rem, 7vw, 4.8rem);
      line-height: 1;
      text-transform: lowercase;
    }

    h2 {
      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.05;
    }

    p {
      font-size: clamp(0.95rem, 1.4vw, 1.1rem);
      line-height: 1.8;
      color: var(--white-soft);
      margin: 0 auto 32px;
      max-width: 560px;
      font-weight: 300;
    }

    .typed::after {
      content: "|";
      display: inline-block;
      margin-left: 3px;
      color: var(--pink);
      animation: blink 0.85s infinite;
    }

    .typed.done::after {
      content: "";
      animation: none;
    }

    @keyframes blink {
      0%, 45% {
        opacity: 1;
      }

      46%, 100% {
        opacity: 0;
      }
    }

    .button {
      display: inline-block;
      padding: 13px 26px;
      border-radius: 999px;
      border: 1px solid var(--border-soft);
      color: white;
      text-decoration: none;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      background: rgba(255, 255, 255, 0.03);
      backdrop-filter: blur(10px);
      transition: 0.3s ease;
      opacity: 0;
      transform: translateY(10px);
    }

    .button.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .button:hover {
      background: var(--pink);
      border-color: var(--pink);
      transform: translateY(-2px);
    }

    .navigation {
      position: fixed;
      bottom: 34px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 50;
    }

    .navigation button {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.18);
      background: rgba(255, 255, 255, 0.04);
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .navigation button:hover {
      background: var(--pink);
      border-color: var(--pink);
    }

    .dots {
      position: fixed;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 12px;
      z-index: 50;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
      transition: 0.3s ease;
    }

    .dot.active {
      background: var(--pink);
      transform: scale(1.4);
      box-shadow: 0 0 10px rgba(245, 5, 79, 0.6);
    }

    .impressum {
      max-width: 700px;
      text-align: center;
    }

    .impressum p {
      margin-bottom: 11px;
      max-width: 100%;
    }

    .impressum a {
      color: white;
      text-decoration: none;
      border-bottom: 1px solid var(--pink);
      padding-bottom: 3px;
      transition: 0.25s ease;
    }

    .impressum a:hover {
      color: var(--pink);
    }

    .small-note {
      color: var(--white-muted);
      font-size: 0.82rem;
      margin-top: 24px;
    }

    @media (max-width: 700px) {
      .slide {
        padding: 28px;
      }

      .dots {
        display: none;
      }

      .logo {
        width: 76px;
        margin-bottom: 28px;
      }

      .navigation {
        bottom: 24px;
      }

      h1 {
        font-size: clamp(2.4rem, 13vw, 4rem);
      }

      h2 {
        font-size: clamp(2rem, 11vw, 3.3rem);
      }

      p {
        font-size: 0.98rem;
      }
    }
  </style>
</head>

<body>

  <div class="top-bar"></div>

  <main class="slider" id="slider">

    <!-- SLIDE 1 -->

    <section class="slide">
      <div class="content is-visible">

        <img src="AS-DOT_RGB.png" alt="Logo Alexander Struber" class="logo">

        <h1 class="typed" data-text="herzlich willkommen."></h1>

        <p class="typed" data-text="Schön, dass du vorbeischaust. Diese Seite ist ein kleiner digitaler Ort für persönliche Einblicke, kreative Projekte und Informationen."></p>

        <a href="#" class="button" onclick="goToSlide(1)">
          Mehr erfahren
        </a>

      </div>
    </section>

    <!-- SLIDE 2 -->

    <section class="slide">
      <div class="content">

        <h2 class="typed" data-text="struber.life"></h2>

        <p class="typed" data-text="Ein Name, viele Ideen. Hier entsteht ein ruhiger Platz für Gestaltung, Fotografie, kleine Projekte und alles, was nicht laut sein muss, um Eindruck zu hinterlassen."></p>

        <a href="#" class="button" onclick="goToSlide(2)">
          Impressum
        </a>

      </div>
    </section>

    <!-- SLIDE 3 -->

    <section class="slide">
      <div class="content impressum">

        <h2 class="typed" data-text="Impressum"></h2>

        <p><strong>Alexander Struber</strong></p>
        <p>struber. werbung &amp; fotografie</p>
        <p>Kirchgöming 11 · A-5114 Göming</p>
        <p>
          <a href="mailto:alexander@struber.cc">alexander@struber.cc</a>
        </p>
        <p>
          <a href="tel:+4366480225411">+43 664 80 225 411</a>
        </p>

        <p class="small-note">
          Offizieller Eintrag im
          <a href="https://firmen.wko.at/alexander-struber-struber-werbung-und-fotografie/salzburg/?firmaid=5c5f312b-af74-4585-b14a-0dd2e56300ef&standortid=1297&standortname=g%c3%b6ming%20%28gemeinde%29&suchbegriff=struber" target="_blank" rel="noopener">
            WKO Firmen A-Z
          </a>
        </p>

      </div>
    </section>

  </main>

  <div class="dots">
    <div class="dot active" id="dot0"></div>
    <div class="dot" id="dot1"></div>
    <div class="dot" id="dot2"></div>
  </div>

  <div class="navigation">
    <button onclick="prevSlide()" aria-label="Vorherige Seite">‹</button>
    <button onclick="nextSlide()" aria-label="Nächste Seite">›</button>
  </div>

  <script>
    let currentSlide = 0;
    let isAnimating = false;

    const totalSlides = 3;
    const slider = document.getElementById("slider");
    const contents = document.querySelectorAll(".content");
    const dots = document.querySelectorAll(".dot");

    function typeElement(element, speed = 28) {
      const text = element.getAttribute("data-text");

      if (!text) return Promise.resolve();

      element.textContent = "";
      element.classList.remove("done");

      let index = 0;

      return new Promise((resolve) => {
        const interval = setInterval(() => {
          element.textContent += text.charAt(index);
          index++;

          if (index >= text.length) {
            clearInterval(interval);
            element.classList.add("done");
            resolve();
          }
        }, speed);
      });
    }

    async function animateSlideContent(slideIndex) {
      const content = contents[slideIndex];
      const typedElements = content.querySelectorAll(".typed");
      const button = content.querySelector(".button");

      if (button) {
        button.classList.remove("is-visible");
      }

      for (const element of typedElements) {
        await typeElement(element, element.tagName === "H1" || element.tagName === "H2" ? 42 : 16);
      }

      if (button) {
        setTimeout(() => {
          button.classList.add("is-visible");
        }, 180);
      }
    }

    function updateDots() {
      dots.forEach((dot) => dot.classList.remove("active"));
      dots[currentSlide].classList.add("active");
    }

    function goToSlide(number) {
      if (isAnimating || number === currentSlide) return;

      isAnimating = true;

      const currentContent = contents[currentSlide];
      currentContent.classList.add("is-leaving");
      currentContent.classList.remove("is-visible");

      setTimeout(() => {
        currentSlide = number;

        slider.style.transform =
          "translateX(-" + currentSlide * 100 + "vw)";

        updateDots();

        contents.forEach((content) => {
          content.classList.remove("is-leaving", "is-entering", "is-visible");
        });

        const nextContent = contents[currentSlide];
        nextContent.classList.add("is-entering");

        setTimeout(() => {
          nextContent.classList.remove("is-entering");
          nextContent.classList.add("is-visible");
          animateSlideContent(currentSlide);
          isAnimating = false;
        }, 420);

      }, 320);
    }

    function nextSlide() {
      const next = (currentSlide + 1) % totalSlides;
      goToSlide(next);
    }

    function prevSlide() {
      const previous = (currentSlide - 1 + totalSlides) % totalSlides;
      goToSlide(previous);
    }

    document.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") {
        nextSlide();
      }

      if (event.key === "ArrowLeft") {
        prevSlide();
      }
    });

    window.addEventListener("load", () => {
      animateSlideContent(0);
    });
  </script>

</body>
</html>
